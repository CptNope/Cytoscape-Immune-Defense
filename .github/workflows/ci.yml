name: CI

on:
  pull_request:
  push:
    branches-ignore: ['main']

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the preview build ref below
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: dist
          retention-days: 7

      # The built site as a hidden git ref (not a branch), so it can be
      # fetched and checked with plain git: git fetch origin refs/previews/<branch>
      - name: Publish preview build ref
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: dist
        run: |
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Preview build of ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/previews/${{ github.head_ref }}
